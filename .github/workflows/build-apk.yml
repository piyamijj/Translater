name: Build Android APK

# Runs on every push to main (nightly-style build artifact) and on version
# tags (v*), which additionally publish the APK to GitHub Releases.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build static web bundle (Capacitor target)
        run: npm run build:capacitor

      - name: Generate native Android project if missing
        id: gen_android
        run: |
          if [ ! -d "android/app" ]; then
            # `cap add android` refuses to run if an `android/` directory
            # exists at all (even an empty or non-Capacitor one), so clear
            # any stray leftovers before generating a fresh project.
            if [ -d "android" ]; then
              echo "Removing incomplete android/ directory before generating"
              rm -rf android
            fi
            echo "generating native project via Capacitor CLI"
            npx cap add android
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "android/app already present — skipping generation"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated android/ project back to the repo
        if: steps.gen_android.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "chore: generate Capacitor Android native project [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Sync web build into native project
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode release keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"

      - name: Build debug APK (no signing secrets configured)
        if: steps.keystore.outputs.has_keystore != 'true'
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Locate built APK
        id: apk
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "path=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=PolyGlot-Live-AI-release.apk" >> "$GITHUB_OUTPUT"
          else
            echo "path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=PolyGlot-Live-AI-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: polyglot-live-ai-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish to GitHub Releases (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
